name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A version bump without a CHANGELOG section is how release notes go missing.
      - name: the manifest version has a CHANGELOG section
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          echo "manifest version: ${version}"
          test -n "${version}"
          grep -qF "## [${version}]" CHANGELOG.md || {
            echo "::error file=CHANGELOG.md::no section '## [${version}]' for the version in Cargo.toml" >&2
            exit 1
          }

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # 98% line coverage locally; the gate stops it from sliding.
      - run: cargo llvm-cov --all-features --summary-only --fail-under-lines 95

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo +nightly fuzz build parse

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
