name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      # The example is the documentation that runs: build it with every
      # feature and execute it, so it cannot drift from the API.
      - name: Examples build and run
        run: |
          cargo build --examples --all-features
          cargo run --quiet --example compose_and_parse --all-features
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A version bump without a CHANGELOG section is how release notes go missing.
      - name: the manifest version has a CHANGELOG section
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          echo "manifest version: ${version}"
          test -n "${version}"
          grep -qF "## [${version}]" CHANGELOG.md || {
            echo "::error file=CHANGELOG.md::no section '## [${version}]' for the version in Cargo.toml" >&2
            exit 1
          }

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # 98% line coverage locally; the gate stops it from sliding.
      - run: cargo llvm-cov --all-features --summary-only --fail-under-lines 95

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo +nightly fuzz build parse

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The gate must see feature-gated dependencies: without `[graph]`,
      # cargo-deny resolves default features only and `rsa` (behind `dkim`,
      # carrying RUSTSEC-2023-0071) is never audited. Fail the config rather
      # than silently auditing a smaller graph than the crate ships.
      - name: deny.toml audits every feature
        run: |
          set -eu
          grep -qxF "[graph]" deny.toml || {
            echo "::error file=deny.toml::no [graph] section, feature-gated dependencies would not be audited" >&2
            exit 1
          }
          grep -qxF "all-features = true" deny.toml || {
            echo "::error file=deny.toml::[graph] must set all-features = true" >&2
            exit 1
          }
      - uses: EmbarkStudios/cargo-deny-action@v2
