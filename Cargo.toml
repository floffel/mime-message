[package]
name = "mime-message"
version = "0.3.1"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Build and parse RFC 5322 / MIME email messages, without an SMTP dependency"
repository = "https://github.com/floffel/mime-message"
documentation = "https://docs.rs/mime-message"
keywords = ["email", "mime", "rfc5322", "rfc2047", "smtp"]
categories = ["email", "encoding", "parser-implementations"]
readme = "README.md"
exclude = [".github/**", "deny.toml", "fuzz/**"]

[dependencies]
base64 = "0.23"
thiserror = "2"

# DKIM is optional: it pulls in RSA/Ed25519 and a SHA-256 implementation.
ed25519-dalek = { version = "2.2", optional = true, default-features = false, features = ["std", "pkcs8", "pem"] }
rsa = { version = "0.9", optional = true, default-features = false, features = ["std", "sha2", "pem"] }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2.6", optional = true }

[dev-dependencies]
base64 = "0.23"
proptest = "1"
sha2 = "0.10"

[features]
default = []
dkim = ["dep:ed25519-dalek", "dep:rsa", "dep:sha2", "dep:subtle"]

# docs.rs builds every feature, so the `dkim` module is visible there.
[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
