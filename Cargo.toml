[package]
name = "mime-message"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Build RFC 5322 / MIME email messages as bytes, without an SMTP dependency"
repository = "https://github.com/floffel/mime-message"
documentation = "https://docs.rs/mime-message"
keywords = ["email", "mime", "rfc5322", "smtp"]
categories = ["email", "encoding"]
readme = "README.md"
exclude = [".github/**", "deny.toml"]

[dependencies]
base64 = "0.22"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
