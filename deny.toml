# The gate must see feature-gated dependencies, not just the default ones.
# Without this block cargo-deny resolves default features only, and `rsa` -
# which sits behind the non-default `dkim` feature and carries
# RUSTSEC-2023-0071 - is invisible: "advisories ok" for a graph that was
# never audited. `unused-ignored-advisory = "deny"` turns a regression here
# back into a failure (an ignore that matches no crate is an error).

[graph]
all-features = true

[advisories]
version = 2
unused-ignored-advisory = "deny"
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 ("Marvin attack"): `rsa`'s PKCS#1 v1.5 padding is not
    # constant time, which leaks private-key timing to an attacker who can
    # submit ciphertexts and observe the response - a decryption oracle.
    # This crate never decrypts. It signs (fixed key, caller-supplied message,
    # no oracle) and verifies with public keys only, so the vulnerable padding
    # path is unreachable. `patched = []` upstream, so 0.9 is the only option
    # for a DKIM RSA signer today; re-check when `rsa` ships a fix.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = ["CDLA-Permissive-2.0", "MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
